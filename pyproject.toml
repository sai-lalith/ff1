[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ff3-1"
version = "0.1.0"
description = "FF3-1 format-preserving encryption (NIST SP 800-38G Rev. 1)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Sai Lalith Kumar"}]
requires-python = ">=3.9"
dependencies = ["pycryptodome>=3.10"]

[project.optional-dependencies]
test = ["ff3>=1.0.3"]

[tool.setuptools]
packages = ["ff3_1"]
